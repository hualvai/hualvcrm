# GoodJob CRM compose（增强版）
# 基于官方 1.7.2 compose.yml，改动两处（其余逐行保持官方原样）：
#   改动 1【1292 修复】：mysql command 追加 --sql-mode（移除严格模式）与 --default-time-zone=+00:00。
#     背景：应用以 ISO 时间字符串写 DATETIME，MySQL 8.4 默认严格模式（STRICT_TRANS_TABLES）
#     会拒绝写入并导致前端报"参数格式错误"；时区统一 UTC 保证读写一致。
#   改动 2【502 根治】：private 网络固定网段 172.18.0.0/16，并为每个容器分配固定内网 IP。
#     背景：容器重建后 IP 随机变化，gateway/nginx 缓存旧 IP 会导致全站 502；
#     固定 IP 后无论用宝塔还是命令行重建，IP 永不变。
# postgres 服务保留官方 profiles: ["legacy-migration"] 限制，日常编排重建不会启动它。
# 版本号来源：GOODJOB_RELEASE_ID（由编排 .env 注入），镜像地址来源 GOODJOB_*_IMAGE。

services:
  mysql:
    image: mysql:8.4.6
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 缓冲池务必 ≤128M：MySQL 按 innodb_buffer_pool_chunk_size(128M) 对齐，
      # 192M 会被放大成 256M；640m 容器上限下曾因 384M 池触发 cgroup OOM 杀掉 mysqld。
      - --innodb-buffer-pool-size=128M
      - --max-connections=60
      # 以下三项针对 640m 容器上限瘦身（mysql:8.4 镜像默认 log buffer 就是 64M、
      # performance_schema 默认开启约吃 127MB，对小型库纯属浪费；瘦身后 RSS 607M→200M）。
      - --innodb-log-buffer-size=16M
      - --table-open-cache=512
      - --performance-schema=OFF
      # 本项目要求关闭 binlog（MySQL 8.0 起默认开启）。后端与迁移启动时会校验 @@log_bin，
      # 生产环境未关闭会拒绝启动；不要删除这一行。
      - --disable-log-bin
      # 【1292 修复】移除严格模式（ISO 时间字符串写 DATETIME 兼容）+ 时区统一 UTC
      - --sql-mode=ONLY_FULL_GROUP_BY,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION
      - --default-time-zone=+00:00
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      private:
        ipv4_address: 172.18.0.10
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat /run/secrets/mysql_root_password) mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: ${MYSQL_MEMORY_LIMIT:-640m}
    cpus: ${MYSQL_CPU_LIMIT:-1.0}
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16.9-alpine
    profiles: ["legacy-migration"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-goodjobcrm_whatsapp_prod}
      POSTGRES_USER: ${POSTGRES_USER:-goodjobcrm_whatsapp_app}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=60
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      private:
        ipv4_address: 172.18.0.11
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 20s
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-384m}
    cpus: ${POSTGRES_CPU_LIMIT:-0.75}
    security_opt:
      - no-new-privileges:true

  backend-migrate:
    image: ${GOODJOB_BACKEND_IMAGE:-goodjobcrm-backend}:${GOODJOB_RELEASE_ID}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.backend
    restart: "no"
    environment: &backend_environment
      NODE_ENV: production
      CRM_STORE: mysql
      APP_DATABASE_PROFILE: production
      CRM_SEED_DEVELOPMENT_DATA: "false"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Super Admin}
      BACKEND_HOST: 0.0.0.0
      CONTAINER_NETWORK_BIND: "true"
      TRUST_PROXY_HOPS: "1"
      PORT: "4188"
      LIBREOFFICE_BIN: /usr/bin/soffice
      WHATSAPP_PLUGIN_INTERNAL_URL: http://communication:3100
      WHATSAPP_PLUGIN_PORT: "3100"
      CORS_ORIGINS: ${PUBLIC_ORIGIN}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      INBOUND_MAIL_ENABLED: "true"
      INBOUND_MAIL_POLL_MS: "120000"
      INBOUND_MAIL_LOOKBACK_DAYS: "7"
      INBOUND_MAIL_MAX_MESSAGES_PER_POLL: "100"
      INBOUND_MAIL_MAX_SOURCE_BYTES: "2097152"
      EMAIL_TRACKING_BASE_URL: ${EMAIL_TRACKING_BASE_URL:-}
      TRACKING_PROVIDER: ${TRACKING_PROVIDER:-17track}
      EMAIL_MESSAGE_ID_DOMAIN: ${DOMAIN}
      OUTBOUND_EMAIL_DAILY_LIMIT: "50"
      OUTBOUND_EMAIL_DOMAIN_WINDOW_MINUTES: "10"
      OUTBOUND_EMAIL_DOMAIN_WINDOW_LIMIT: "5"
      OUTBOUND_EMAIL_BOUNCE_WINDOW_DAYS: "7"
      OUTBOUND_EMAIL_BOUNCE_MIN_SAMPLE: "20"
      OUTBOUND_EMAIL_MAX_BOUNCE_PERCENT: "10"
      OUTBOUND_EMAIL_APPEND_OPTOUT: "true"
      OUTBOUND_EMAIL_REQUIRE_DNS_AUTH: "false"
      EMAIL_DKIM_SELECTORS: ""
      AGENT_KNOWLEDGE_DIR: /app/agent-knowledge
      AGENT_SKILLS_DIR: /app/agent-skills
      GOODJOB_UPLOADS_DIR: /app/uploads
      MYSQL_LOCAL_BACKUP_ENABLED: "false"
      GOODJOB_RELEASE_ID: ${GOODJOB_RELEASE_ID}
    secrets: &backend_secrets
      - mysql_password
      - initial_admin_password
      - admin_credentials
      - crm_runtime_env
    networks:
      private:
        ipv4_address: 172.18.0.12
    depends_on:
      mysql:
        condition: service_healthy
    command: ["node", "backend/dist/migrate-mysql.js"]
    profiles:
      - tools
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true

  communication-migrate:
    image: ${GOODJOB_COMMUNICATION_IMAGE:-goodjobcrm-communication}:${GOODJOB_RELEASE_ID}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.communication
    restart: "no"
    environment: &communication_environment
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      WEB_ORIGIN: ${PUBLIC_ORIGIN}
      DATABASE_CLIENT: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      LEGACY_POSTGRES_HOST: postgres
      LEGACY_POSTGRES_PORT: "5432"
      LEGACY_POSTGRES_DB: ${POSTGRES_DATABASE:-goodjobcrm_whatsapp_prod}
      LEGACY_POSTGRES_USER: ${POSTGRES_USER:-goodjobcrm_whatsapp_app}
      MEDIA_STORAGE_PATH: /data/media
      SEED_DEMO: "false"
      ALLOW_DEMO_PROVIDER: "false"
      WHATSAPP_OFFICIAL_ONLY: "true"
      AUTO_MIGRATE: "false"
      ALLOW_PRIVATE_AI_ENDPOINTS: "false"
    secrets: &communication_secrets
      - mysql_password
      - postgres_password
      - communication_session_key
      - crm_runtime_env
    networks:
      private:
        ipv4_address: 172.18.0.13
    depends_on:
      mysql:
        condition: service_healthy
    command: ["node", "dist-server/server/scripts/migrate.js"]
    profiles:
      - tools
    mem_limit: 384m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${GOODJOB_BACKEND_IMAGE:-goodjobcrm-backend}:${GOODJOB_RELEASE_ID}
    restart: unless-stopped
    environment: *backend_environment
    secrets: *backend_secrets
    networks:
      private:
        ipv4_address: 172.18.0.14
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "4188"
    depends_on:
      mysql:
        condition: service_healthy
      communication:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4188/api/health"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: ${BACKEND_MEMORY_LIMIT:-640m}
    cpus: ${BACKEND_CPU_LIMIT:-1.5}
    security_opt:
      - no-new-privileges:true

  communication:
    image: ${GOODJOB_COMMUNICATION_IMAGE:-goodjobcrm-communication}:${GOODJOB_RELEASE_ID}
    restart: unless-stopped
    environment: *communication_environment
    secrets:
      - mysql_password
      - communication_session_key
      - crm_runtime_env
    volumes:
      - communication_media:/data/media
    networks:
      private:
        ipv4_address: 172.18.0.15
    expose:
      - "3100"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3100/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: ${COMMUNICATION_MEMORY_LIMIT:-384m}
    cpus: ${COMMUNICATION_CPU_LIMIT:-1.0}
    security_opt:
      - no-new-privileges:true

  gateway:
    image: ${GOODJOB_GATEWAY_IMAGE:-goodjobcrm-gateway}:${GOODJOB_RELEASE_ID}
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile.gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GOODJOB_HTTP_PORT:-4188}:8080"
    networks:
      private:
        ipv4_address: 172.18.0.16
    depends_on:
      backend:
        condition: service_healthy
      communication:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/container-health"]
      interval: 30s
      timeout: 5s
      retries: 8
      start_period: 10s
    mem_limit: 96m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true

secrets:
  mysql_password:
    file: ${GOODJOB_SHARED_DIR}/secrets/mysql_password
  mysql_root_password:
    file: ${GOODJOB_SHARED_DIR}/secrets/mysql_root_password
  postgres_password:
    file: ${GOODJOB_SHARED_DIR}/secrets/postgres_password
  initial_admin_password:
    file: ${GOODJOB_SHARED_DIR}/secrets/initial_admin_password
  admin_credentials:
    file: ${GOODJOB_SHARED_DIR}/secrets/admin_credentials.tsv
  communication_session_key:
    file: ${GOODJOB_SHARED_DIR}/secrets/communication_session_key
  crm_runtime_env:
    file: ${GOODJOB_SHARED_DIR}/secrets/crm_runtime_env

volumes:
  mysql_data:
    name: goodjobcrm_mysql_data
  postgres_data:
    name: goodjobcrm_postgres_data
  communication_media:
    name: goodjobcrm_communication_media
  uploads_data:
    name: goodjobcrm_uploads_data

networks:
  private:
    name: goodjobcrm_private
    driver: bridge
    # 【502 根治】固定网段，配合各服务 ipv4_address 实现重建后 IP 不变
    ipam:
      config:
        - subnet: 172.18.0.0/16
